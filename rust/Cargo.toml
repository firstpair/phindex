[package]
name = "phindex"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Resumable photo-identity index of a directory tree in SQLite: one binary, N workers, every phidentify identity from one read"
license = "MIT"
repository = "https://github.com/firstpair/phindex"

[[bin]]
name = "phindex"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.151"
anyhow = "1.0"
flate2 = "1.1"
mimalloc = "0.1"
phidentify = { git = "https://github.com/firstpair/phidentify", rev = "cbcb57776738de10309f44368a970a3752dc1478", features = ["lightroom", "metadata", "semantic"] }
rayon = "1.12"
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
